<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title>视频自进化系统 · 两线七节点流程图</title>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="970" fill="#FAFAF9"/>

  <!-- ============ 进化线区域 ============ -->
  <rect x="30" y="30" width="1380" height="400" rx="16" fill="#FFF9ED" stroke="#F59E0B" stroke-opacity="0.35"/>
  <text x="52" y="70" font-size="20" font-weight="bold" fill="#B45309">进化线 · 研发厨房</text>
  <text x="52" y="94" font-size="13" fill="#B45309" opacity="0.8">沙盒：天天鼓捣，但碰不到生产线一根毫毛</text>

  <!-- 输入 -->
  <rect x="60" y="149" width="140" height="44" rx="22" fill="#E7E5E4" filter="url(#soft)"/>
  <text x="130" y="177" font-size="13" fill="#44403C" text-anchor="middle">互联网热点 / 梗</text>
  <rect x="60" y="279" width="140" height="44" rx="22" fill="#E7E5E4" filter="url(#soft)"/>
  <text x="130" y="307" font-size="13" fill="#44403C" text-anchor="middle">写作 / 制作技巧</text>

  <!-- 节点1 梗图侦察兵 -->
  <rect x="250" y="133" width="180" height="76" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#soft)"/>
  <circle cx="250" cy="133" r="12" fill="#D97706"/>
  <text x="250" y="137.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="340" y="163" font-size="15.5" font-weight="bold" fill="#78350F" text-anchor="middle">梗图侦察兵</text>
  <text x="340" y="185" font-size="11.5" fill="#78716C" text-anchor="middle">日更 · 刷热点收梗</text>
  <text x="340" y="201" font-size="11.5" fill="#78716C" text-anchor="middle">解读 + 受众 + 热度打分</text>

  <!-- 节点2 技巧侦察兵 -->
  <rect x="250" y="263" width="180" height="76" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#soft)"/>
  <circle cx="250" cy="263" r="12" fill="#D97706"/>
  <text x="250" y="267.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="340" y="293" font-size="15.5" font-weight="bold" fill="#78350F" text-anchor="middle">技巧侦察兵</text>
  <text x="340" y="315" font-size="11.5" fill="#78716C" text-anchor="middle">周更 · 收集写作/制作技巧</text>
  <text x="340" y="331" font-size="11.5" fill="#78716C" text-anchor="middle">整理成可复用的 skill</text>

  <!-- 输入到侦察兵 -->
  <path d="M200,171 H250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M200,301 H250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 节点3 审核员 -->
  <rect x="510" y="190" width="180" height="88" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#soft)"/>
  <circle cx="510" cy="190" r="12" fill="#D97706"/>
  <text x="510" y="194.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="600" y="220" font-size="15.5" font-weight="bold" fill="#78350F" text-anchor="middle">审核员</text>
  <text x="600" y="242" font-size="11.5" fill="#78716C" text-anchor="middle">对照品味档案判卷：</text>
  <text x="600" y="260" font-size="11.5" fill="#78716C" text-anchor="middle">过 / 毙 / 拿不准就升级</text>

  <!-- 提案箭头 -->
  <path d="M430,165 H468 V214 H510" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="449" y="158" font-size="11" fill="#57534E" text-anchor="middle">提案</text>
  <path d="M430,309 H468 V254 H510" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="449" y="325" font-size="11" fill="#57534E" text-anchor="middle">提案</text>

  <!-- 试验田 -->
  <rect x="760" y="210" width="160" height="60" rx="8" fill="#F5F5F4" stroke="#78716C" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="840" y="234" font-size="13.5" font-weight="bold" fill="#57534E" text-anchor="middle">试验田 · 候选库</text>
  <text x="840" y="254" font-size="11" fill="#78716C" text-anchor="middle">develop 分支</text>
  <path d="M690,232 H760" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="725" y="222" font-size="11" fill="#57534E" text-anchor="middle">通过入库</text>

  <!-- 品味档案 -->
  <rect x="760" y="92" width="180" height="60" rx="8" fill="#F5F5F4" stroke="#78716C" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="850" y="116" font-size="13.5" font-weight="bold" fill="#57534E" text-anchor="middle">品味档案 + 判例本</text>
  <text x="850" y="136" font-size="11" fill="#78716C" text-anchor="middle">规则层 · 案例层</text>
  <path d="M760,122 H600 V190" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrGrey)"/>
  <text x="680" y="114" font-size="11" fill="#78716C" text-anchor="middle">对照判卷</text>

  <!-- 你（进化侧） -->
  <circle cx="1020" cy="335" r="26" fill="#FDF2F8" stroke="#DB2777" stroke-width="2" filter="url(#soft)"/>
  <text x="1020" y="341" font-size="16" font-weight="bold" fill="#BE185D" text-anchor="middle">你</text>
  <text x="1020" y="381" font-size="11.5" fill="#DB2777" text-anchor="middle">你的回答 = 判例</text>

  <!-- 审核员 → 你 -->
  <path d="M680,262 L994,335" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="837" y="288" font-size="11" fill="#57534E" text-anchor="middle">拿不准，升级</text>

  <!-- 节点4 品味策展人 -->
  <rect x="1100" y="183" width="200" height="96" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="3" filter="url(#soft)"/>
  <circle cx="1100" cy="183" r="12" fill="#B45309"/>
  <text x="1100" y="187.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1200" y="211" font-size="16" font-weight="bold" fill="#7C2D12" text-anchor="middle">品味策展人</text>
  <text x="1200" y="233" font-size="11.5" fill="#9A3412" text-anchor="middle">消化反馈 → 蒸馏规则</text>
  <text x="1200" y="250" font-size="11.5" fill="#9A3412" text-anchor="middle">维护档案 · 攒版本</text>
  <text x="1200" y="267" font-size="11.5" fill="#9A3412" text-anchor="middle">黄金集回归测试 → 发布</text>

  <!-- 你 → 策展人 -->
  <path d="M1038,317 L1150,279" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 策展人 → 档案 -->
  <path d="M1100,205 L1010,122 H940" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrGrey)"/>
  <text x="1020" y="112" font-size="11" fill="#78716C" text-anchor="middle">蒸馏规则 · 维护档案</text>

  <!-- 发布箭头（穿过大门） -->
  <path d="M1200,279 V445" stroke="#C2410C" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/>
  <text x="1212" y="362" font-size="12.5" fill="#C2410C">攒够变化 · 打版本号</text>
  <path d="M1200,505 V600" stroke="#C2410C" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/>
  <text x="1188" y="528" font-size="12" fill="#C2410C" text-anchor="end">release v13</text>

  <!-- ============ 大门 ============ -->
  <rect x="30" y="445" width="1290" height="60" rx="10" fill="#334155" filter="url(#soft)"/>
  <text x="675" y="470" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">唯 一 的 门 · 发 布 冻 结 版 本</text>
  <text x="675" y="492" font-size="12.5" fill="#CBD5E1" text-anchor="middle">版本号 + 变更日志 + 黄金集回归测试通过，才放行</text>
  <text x="1365" y="478" font-size="11.5" fill="#059669" text-anchor="middle">数据回流 ↑</text>

  <!-- ============ 生产线区域 ============ -->
  <rect x="30" y="520" width="1380" height="420" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-opacity="0.3"/>
  <text x="52" y="560" font-size="20" font-weight="bold" fill="#1D4ED8">生产线 · 正式厨房</text>
  <text x="52" y="584" font-size="13" fill="#3B82F6" opacity="0.85">每期开工锁定一套配方，中途天塌了也不换</text>

  <!-- 冻结配方快照 -->
  <rect x="1040" y="600" width="320" height="60" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="5 3" filter="url(#soft)"/>
  <text x="1200" y="626" font-size="14" font-weight="bold" fill="#9A3412" text-anchor="middle">冻结配方快照 · v13</text>
  <text x="1200" y="646" font-size="11.5" fill="#C2410C" text-anchor="middle">梗库 + 写作库 + 品味档案 + 风格预设</text>

  <!-- 配方总线 -->
  <path d="M1040,630 H325" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M325,630 V700" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrAmber)"/>
  <path d="M641,630 V700" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrAmber)"/>
  <path d="M957,630 V700" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrAmber)"/>
  <text x="640" y="620" font-size="12.5" fill="#C2410C" text-anchor="middle">每期开工时领取同一版配方快照，做完才换</text>

  <!-- 素材 -->
  <rect x="60" y="717" width="130" height="56" rx="10" fill="#E2E8F0" filter="url(#soft)"/>
  <text x="125" y="742" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">素材</text>
  <text x="125" y="759" font-size="11" fill="#64748B" text-anchor="middle">AI 对局数据</text>

  <!-- 节点5 内容策划 -->
  <rect x="240" y="700" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#soft)"/>
  <circle cx="240" cy="700" r="12" fill="#2563EB"/>
  <text x="240" y="704.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="325" y="730" font-size="15.5" font-weight="bold" fill="#1E3A8A" text-anchor="middle">内容策划</text>
  <text x="325" y="752" font-size="11.5" fill="#64748B" text-anchor="middle">素材 → 文案</text>
  <text x="325" y="770" font-size="11.5" fill="#64748B" text-anchor="middle">从冻结梗库挑梗</text>

  <!-- 你 1 -->
  <circle cx="485" cy="745" r="26" fill="#FDF2F8" stroke="#DB2777" stroke-width="2" filter="url(#soft)"/>
  <text x="485" y="751" font-size="16" font-weight="bold" fill="#BE185D" text-anchor="middle">你</text>

  <!-- 节点6 编剧 -->
  <rect x="556" y="700" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#soft)"/>
  <circle cx="556" cy="700" r="12" fill="#2563EB"/>
  <text x="556" y="704.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="641" y="730" font-size="15.5" font-weight="bold" fill="#1E3A8A" text-anchor="middle">编剧</text>
  <text x="641" y="752" font-size="11.5" fill="#64748B" text-anchor="middle">文案 → 镜头脚本</text>
  <text x="641" y="770" font-size="11.5" fill="#64748B" text-anchor="middle">镜头 / 旁白 / 梗位</text>

  <!-- 你 2 -->
  <circle cx="801" cy="745" r="26" fill="#FDF2F8" stroke="#DB2777" stroke-width="2" filter="url(#soft)"/>
  <text x="801" y="751" font-size="16" font-weight="bold" fill="#BE185D" text-anchor="middle">你</text>

  <!-- 节点7 导演 -->
  <rect x="872" y="700" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#soft)"/>
  <circle cx="872" cy="700" r="12" fill="#2563EB"/>
  <text x="872" y="704.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="957" y="730" font-size="15.5" font-weight="bold" fill="#1E3A8A" text-anchor="middle">导演</text>
  <text x="957" y="752" font-size="11.5" fill="#64748B" text-anchor="middle">脚本 → 成片</text>
  <text x="957" y="770" font-size="11.5" fill="#64748B" text-anchor="middle">按风格预设渲染</text>

  <!-- 你 3 -->
  <circle cx="1117" cy="745" r="26" fill="#FDF2F8" stroke="#DB2777" stroke-width="2" filter="url(#soft)"/>
  <text x="1117" y="751" font-size="16" font-weight="bold" fill="#BE185D" text-anchor="middle">你</text>

  <!-- 成片 -->
  <rect x="1188" y="717" width="140" height="56" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1258" y="742" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">成片 · 发布上线</text>
  <text x="1258" y="759" font-size="10.5" fill="#059669" text-anchor="middle">平台数据开始回流</text>

  <!-- 生产线主箭头 -->
  <path d="M190,745 H240" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M410,745 H459" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="434" y="734" font-size="11.5" fill="#475569" text-anchor="middle">文案</text>
  <path d="M511,745 H556" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M726,745 H775" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="750" y="734" font-size="11.5" fill="#475569" text-anchor="middle">脚本</text>
  <path d="M827,745 H872" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1042,745 H1091" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="1066" y="734" font-size="11.5" fill="#475569" text-anchor="middle">成片</text>
  <path d="M1143,745 H1188" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 数据回流 -->
  <path d="M485,771 V850" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrGreen)"/>
  <path d="M801,771 V850" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrGreen)"/>
  <path d="M1117,771 V850" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrGreen)"/>
  <path d="M485,850 H1360" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
  <path d="M1360,850 V232" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
  <path d="M1360,232 H1300" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrGreen)"/>
  <text x="700" y="872" font-size="12.5" fill="#059669" text-anchor="middle">回流：你的每句评价 · 翻车记录 · 平台数据 —— 只送数据，不敲门</text>

  <!-- 平台数据 -->
  <rect x="1188" y="870" width="140" height="44" rx="10" fill="#E2E8F0" filter="url(#soft)"/>
  <text x="1258" y="889" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">平台数据</text>
  <text x="1258" y="906" font-size="10.5" fill="#64748B" text-anchor="middle">完播 / 点赞 / 评论</text>
  <path d="M1258,870 V850" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrGreen)"/>

  <!-- ============ 图例 ============ -->
  <rect x="40" y="943" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="64" y="955" font-size="12.5" fill="#475569">进化线 Agent</text>
  <rect x="170" y="943" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="194" y="955" font-size="12.5" fill="#475569">生产线 Agent</text>
  <circle cx="316" cy="950" r="7" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text x="330" y="955" font-size="12.5" fill="#475569">你 · 人工关口</text>
  <rect x="440" y="943" width="18" height="14" rx="3" fill="#F5F5F4" stroke="#78716C" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="464" y="955" font-size="12.5" fill="#475569">库 / 档案</text>
  <path d="M560,950 H592" stroke="#C2410C" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/>
  <text x="600" y="955" font-size="12.5" fill="#475569">发布 = 唯一入口</text>
  <path d="M740,950 H772" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrGreen)"/>
  <text x="780" y="955" font-size="12.5" fill="#475569">数据回流（不敲门）</text>
</svg>
