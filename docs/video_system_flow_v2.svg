<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title>视频自进化系统 v2 · 两线十节点流程图</title>

