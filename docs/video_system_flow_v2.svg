  <text x="335" y="242" font-size="11.5" fill="#78716C" text-anchor="middle">周更 · 收集写作/制作技巧</text>
  <text x="335" y="258" font-size="11.5" fill="#78716C" text-anchor="middle">整理成可复用的 skill</text>

