<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive 蜂群指挥台</title>
<link rel="stylesheet" href="/ui/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⬡</text></svg>">
</head>
<body>
<canvas id="nebula" aria-hidden="true"></canvas>
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⬡</span>
      <span class="brand-name">HIVE</span>
    </div>
    <div class="project-picker" id="project-picker"></div>
    <div class="topbar-spacer"></div>
    <div class="conn" id="conn" title="连接状态">
      <span class="conn-dot"></span><span class="conn-text">连接中</span>
    </div>
    <button class="decide-entry" id="inbox-entry" title="人类决策台：待你处理的事项">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="decide-label">待决定</span>
      <span class="badge hidden" id="inbox-badge"></span>
    </button>
    <div class="user-chip" id="user-chip"></div>
    <button class="btn btn-ghost btn-sm" id="logout-btn" title="退出登录" aria-label="退出登录"><span class="logout-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></span><span class="logout-text">退出</span></button>
  </header>

  <div class="main">
    <nav class="rail" id="rail" aria-label="工作区">
      <button class="rail-btn active" id="rail-map" title="星图">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/>
          <circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><circle cx="19" cy="6.5" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span>星图</span></button>
      <button class="rail-btn" id="rail-nodes" title="项目与节点">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="8" r="2.2"/>
          <circle cx="10" cy="18" r="2.2"/><path d="M8 7.5 16 8.5M7.5 8.5l2 7.2"/></svg>
        <span>节点</span></button>
      <button class="rail-btn" id="rail-assets" title="共享资产库">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/>
          <path d="M3.5 9.5h17M9 4.5v5"/></svg>
        <span>资产</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="rail-events" title="事件带">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round"><path d="M4 17h16M4 12h10M4 7h13"/></svg>
        <span>事件</span></button>
    </nav>

    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-title">项目与节点</div>
      <div id="nav-projects"></div>
      <div id="nav-nodes" class="nav-nodes"></div>
      <button class="btn btn-ghost btn-sm" id="layout-reset">恢复自动布局</button>
    </div>

    <section class="canvas-wrap" id="canvas-wrap">
      <div class="graph-viewseg seg" id="edge-mode">
        <button class="seg-btn active" data-mode="flows">当前任务</button>
        <button class="seg-btn" data-mode="structure">结构关系</button>
      </div>
      <svg id="graph" tabindex="0" aria-label="项目星图"></svg>
      <div class="graph-hint" id="graph-hint">拖动节点调整布局 · 滚轮缩放 · 点击节点查看详情</div>
      <div class="graph-toolbar">
        <button class="btn btn-ghost btn-sm" id="zoom-fit">适配视图</button>
      </div>
    </section>

    <aside class="detail" id="detail">
      <div class="detail-empty" id="detail-empty">
        <div class="detail-empty-mark">⬡</div>
        <p>选择图中的 Agent、资产库或任务线<br>或打开右上角待决定</p>
      </div>
      <div class="detail-body hidden" id="detail-body"></div>
    </aside>
  </div>

  <footer class="eventband collapsed" id="eventband">
    <button class="eventband-toggle" id="eventband-toggle">
      <span class="eb-arrow">▸</span> 事件带 <span class="eb-count" id="eb-count"></span>
    </button>
    <div class="eventband-list" id="eventband-list"></div>
  </footer>
</div>

<div id="login" class="login hidden">
  <div class="login-card">
    <div class="brand login-brand"><span class="brand-mark">⬡</span><span class="brand-name">HIVE</span></div>
    <h1>蜂群指挥台</h1>
    <p class="login-desc">粘贴 Hive 凭据 token 登录（owner 或 human 凭据，来自 <code>.hive/auth/</code> 凭据文件）。凭据只用于建立本次会话，不会写入浏览器存储。</p>
    <div class="login-secret-row">
      <input id="login-token" class="login-input" type="password" autocomplete="off"
        spellcheck="false" placeholder="凭据 token">
      <button type="button" class="btn btn-ghost btn-sm" id="login-show"
        title="显示/隐藏">👁</button>
    </div>
    <div class="login-err hidden" id="login-err"></div>
    <button class="btn btn-primary login-btn" id="login-btn">登 录</button>
    <p class="login-note" id="login-note"></p>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="/ui/js/main.js"></script>
</body>
</html>
